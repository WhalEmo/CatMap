<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960">
  <defs>
    <style type="text/css">
      <![CDATA[
        text { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif; }
        .title { font-size: 42px; font-weight: 700; fill: #111827; text-anchor: middle; }
        .subtitle { font-size: 18px; font-weight: 400; fill: #6B7280; text-anchor: middle; }
        .heading { font-size: 24px; font-weight: 600; fill: #FFFFFF; }
        .body-text { font-size: 18px; font-weight: 400; fill: #FFFFFF; }
        .child-text { fill: #FFFFFF; font-size: 15px; font-weight: 600; text-anchor: middle; dominant-baseline: central; }
        .group-label { font-size: 14px; font-weight: 700; fill: #94A3B8; letter-spacing: 1.5px; text-transform: uppercase; }
      ]]>
    </style>
    
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.05" flood-color="#000000"/>
    </filter>
    
    <linearGradient id="g-pres" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
    <linearGradient id="g-nav" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="g-vm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="g-repo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="g-map" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34A853"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
    <linearGradient id="g-cam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="g-fb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#94A3B8"/>
    </marker>

    <g id="icon-mobile">
      <rect x="-12" y="-20" width="24" height="40" rx="4" stroke="#FFFFFF" stroke-width="2.5" fill="none"/>
      <line x1="-4" y1="12" x2="4" y2="12" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <g id="icon-nav">
      <path d="M-14,10 L0,-16 L14,10 L0,4 Z" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
    </g>
    <g id="icon-layers">
      <polygon points="0,-12 16,-4 0,4 -16,-4" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
      <polyline points="-16,4 0,12 16,4" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
      <polyline points="-16,12 0,20 16,12" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
    </g>
    <g id="icon-database">
      <ellipse cx="0" cy="-8" rx="14" ry="5" stroke="#FFFFFF" stroke-width="2.5" fill="none"/>
      <path d="M -14 -8 L -14 8 A 14 5 0 0 0 14 8 L 14 -8" stroke="#FFFFFF" stroke-width="2.5" fill="none"/>
      <path d="M -14 0 A 14 5 0 0 0 14 0" stroke="#FFFFFF" stroke-width="2.5" fill="none"/>
    </g>
    <g id="icon-map">
      <path d="M 0 14 Q 12 2 12 -6 A 12 12 0 0 0 -12 -6 Q -12 2 0 14 Z" stroke="#FFFFFF" stroke-width="2.5" fill="none"/>
      <circle cx="0" cy="-6" r="4" stroke="#FFFFFF" stroke-width="2.5" fill="none"/>
    </g>
    <g id="icon-camera">
      <rect x="-16" y="-10" width="32" height="22" rx="4" stroke="#FFFFFF" stroke-width="2.5" fill="none"/>
      <circle cx="0" cy="1" r="6" stroke="#FFFFFF" stroke-width="2.5" fill="none"/>
      <path d="M -6 -10 L -4 -16 L 4 -16 L 6 -10" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
    </g>
    <g id="icon-firebase">
      <path d="M -4 14 L -12 0 L -6 -12 L 0 -2 L 4 -8 L 12 8 Z" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
    </g>
  </defs>

  <rect width="100%" height="100%" fill="#FFFFFF"/>
  
  <text x="800" y="70" class="title">CatMap Architecture</text>
  <text x="800" y="105" class="subtitle">MVVM Architecture with Firebase Backend</text>

  <g filter="url(#shadow)">
    
    <rect x="350" y="150" width="900" height="110" rx="18" fill="url(#g-pres)" stroke="#D0D7DE" stroke-width="2"/>
    <g transform="translate(410, 205)"><use href="#icon-mobile"/></g>
    <text x="460" y="195" class="heading">Presentation Layer</text>
    <text x="460" y="228" class="body-text">Activities • Fragments • XML Layouts</text>

    <rect x="350" y="295" width="900" height="95" rx="18" fill="url(#g-nav)" stroke="#D0D7DE" stroke-width="2"/>
    <g transform="translate(410, 342.5)"><use href="#icon-nav"/></g>
    <text x="460" y="337" class="heading">Navigation Engine</text>
    <text x="460" y="367" class="body-text">Fragment Navigation • Custom Jetpack Navigation Engine Extension</text>

    <rect x="350" y="425" width="900" height="110" rx="18" fill="url(#g-vm)" stroke="#D0D7DE" stroke-width="2"/>
    <g transform="translate(410, 480)"><use href="#icon-layers"/></g>
    <text x="460" y="470" class="heading">ViewModel Layer</text>
    <text x="460" y="503" class="body-text">Business Logic • LiveData Lifecycle States • Coroutine Scope Isolation</text>

    <rect x="350" y="570" width="900" height="110" rx="18" fill="url(#g-repo)" stroke="#D0D7DE" stroke-width="2"/>
    <g transform="translate(410, 625)"><use href="#icon-database"/></g>
    <text x="460" y="615" class="heading">Repository Layer</text>
    <text x="460" y="648" class="body-text">Data Access Hub • Async Coroutines • Firebase Integration &amp; Cache Management</text>

    <rect x="120" y="725" width="1360" height="200" rx="18" fill="none" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="140" y="750" class="group-label">Data Sources / External Services</text>

    <rect x="140" y="765" width="280" height="140" rx="18" fill="url(#g-map)" stroke="#D0D7DE" stroke-width="2"/>
    <g transform="translate(280, 810) scale(1.1)"><use href="#icon-map"/></g>
    <text x="280" y="855" class="heading" text-anchor="middle" style="font-size: 20px;">Maps SDK</text>
    <text x="280" y="882" class="body-text" text-anchor="middle" style="font-size: 15px;">Interactive Maps</text>

    <rect x="450" y="765" width="280" height="140" rx="18" fill="url(#g-cam)" stroke="#D0D7DE" stroke-width="2"/>
    <g transform="translate(590, 810) scale(1.1)"><use href="#icon-camera"/></g>
    <text x="590" y="855" class="heading" text-anchor="middle" style="font-size: 20px;">Camera &amp; Gallery</text>
    <text x="590" y="882" class="body-text" text-anchor="middle" style="font-size: 15px;">CameraX Engine</text>

    <rect x="760" y="765" width="700" height="140" rx="18" fill="url(#g-fb)" stroke="#D0D7DE" stroke-width="2"/>
    <g transform="translate(820, 835) scale(1.5)"><use href="#icon-firebase"/></g>
    <text x="875" y="825" class="heading" style="font-size: 22px;">Firebase Platform</text>
    <text x="875" y="852" class="body-text" style="font-size: 15px;">Unified Cloud Infrastructure</text>
    
    <g transform="translate(875, 868)">
      <rect x="0" y="0" width="105" height="26" rx="6" fill="#FACC15" opacity="0.9"/>
      <text x="52.5" y="14" class="child-text" style="fill:#111827;">Auth</text>

      <rect x="115" y="0" width="105" height="26" rx="6" fill="#F97316"/>
      <text x="167.5" y="14" class="child-text">Firestore</text>

      <rect x="230" y="0" width="105" height="26" rx="6" fill="#06B6D4"/>
      <text x="282.5" y="14" class="child-text">Storage</text>

      <rect x="345" y="0" width="105" height="26" rx="6" fill="#8B5CF6"/>
      <text x="397.5" y="14" class="child-text">Realtime DB</text>

      <rect x="460" y="0" width="105" height="26" rx="6" fill="#34A853"/>
      <text x="512.5" y="14" class="child-text">GeoFire</text>
    </g>
  </g>

  <g stroke="#94A3B8" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M 800 260 L 800 292"/>
    <path d="M 800 390 L 800 422"/>
    <path d="M 800 535 L 800 567"/>
    <path d="M 800 680 L 800 722"/>
  </g>
</svg>
